[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-mrv-audit-warehouse"
version = "0.1.0"
description = "Carbon MRV evidence, emission factor, restatement and lineage warehouse"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
